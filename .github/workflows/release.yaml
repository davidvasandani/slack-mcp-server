name: Release NPM

# Fork releases (`v<base>-vk.<n>`) are built and published by
# scripts/build-release.sh + `gh release create`, not by this workflow: its
# final step publishes to the *upstream* npm package name, which this fork does
# not own. Ignore those tags so cutting a fork release can never trigger a
# publish under someone else's name.
on:
  push:
    tags-ignore:
      - '*-vk.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.25
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

permissions:
  contents: write
  discussions: write

jobs:
  release:
    name: Release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: npm install -g @anthropic-ai/dxt

      - name: Build binaries
        run: make build-all-platforms

      - name: Build DTX Extension
        run: make build-dxt

      - name: Upload artifacts
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: true
          files: |
            LICENSE
            build/slack-mcp-server-*
            build/slack-mcp-server.dxt
            .env.dist
            docker-compose.yml

      - name: Publish npm
        if: ${{ env.NPM_TOKEN != '' }}
        run:
          make npm-publish
