name: Integration Tests
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check live-test credentials
        id: credentials
        env:
          SLACK_MCP_OPENAI_API: ${{ secrets.SLACK_MCP_OPENAI_API }}
          SLACK_MCP_XOXP_TOKEN: ${{ secrets.SLACK_MCP_XOXP_TOKEN }}
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          if [ -n "$SLACK_MCP_OPENAI_API" ] && [ -n "$SLACK_MCP_XOXP_TOKEN" ] && [ -n "$NGROK_AUTH_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Live integration tests not run: Slack, OpenAI, and ngrok test credentials are not all configured. Hermetic tests run in Unit Tests." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@v6

      - name: Set up Go
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Download dependencies
        if: steps.credentials.outputs.configured == 'true'
        run: make deps

      - name: Run integration tests
        if: steps.credentials.outputs.configured == 'true'
        env:
          SLACK_MCP_OPENAI_API: ${{ secrets.SLACK_MCP_OPENAI_API }}
          SLACK_MCP_XOXP_TOKEN: ${{ secrets.SLACK_MCP_XOXP_TOKEN }}
          NGROK_AUTH_TOKEN:     ${{ secrets.NGROK_AUTH_TOKEN }}
        run: make test-integration
